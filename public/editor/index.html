<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lernpfad-Editor (PathFinder) · JPad</title>
<link rel="icon" href="../jpad-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../pathfinder/core/pathfinder.css">
</head>
<body>
<div class="app" id="app">
  <section class="lpwrap" aria-label="Lernpfad">
    <div class="ed-bar" id="edBar">
      <span class="pf-brand"><img src="../pathfinder/icon.svg" alt=""><span>PathFinder</span></span>
      <span class="ed-seg" id="modeSeg"><button data-mode="edit" aria-pressed="true">✎ Bearbeiten</button><button data-mode="preview">▶ Vorschau</button></span>
      <button class="ed-btn" id="bUndo" title="Rückgängig (⌘Z)" aria-label="Rückgängig">↶</button>
      <button class="ed-btn" id="bRedo" title="Wiederholen (⇧⌘Z)" aria-label="Wiederholen">↷</button>
      <button class="ed-btn" id="bSingle" title="Nur aktuelle Station zeigen" aria-pressed="false">◧<span class="t"> Station</span></button>
      <button class="ed-btn" id="bDesign" title="Design">🎨<span class="t"> Design</span></button>
      <span class="sp"></span>
      <span class="ed-saved" id="saved"></span>
      <button class="ed-btn" id="bOpen" title="Lernpfad öffnen oder neu anlegen">📂<span class="t"> Öffnen</span></button>
      <button class="ed-btn" id="bMore" title="Mehr">⋯</button>
    </div>
    <div class="lp-scroll" id="scroll"><div class="lp" id="lp"></div></div>
  </section>
</div>
<script type="module">
import { startPathFinder } from '../pathfinder/core/pathfinder.js';
import { jpadPlugin, createBridgeHost, makeBridge } from './jpad-plugin.js';

// In JPad geöffnet (Menü → Lernpfad-Editor)? Dann spricht der Editor direkt mit JPad.
const inJPad = new URLSearchParams(location.search).get('in') === 'jpad' && parent !== window;

const sample = () => ({
  v: 2, id: 'jpad-entwurf', form: 'lernpfad', design: { pal: 2, font: 'pixel', shape: 'eckig', hero: 'logo', heroImg: '' },
  kicker: 'JPad · Lernpfad', title: 'Bello bellt', subtitle: 'Methoden aufrufen und Ausgaben prüfen', goals: [], rank: '', anim: {}, typeLines: [],
  stations: [
    { title: 'Die Klasse Hund', sub: 'Code übernehmen', blocks: [
      { type: 'text', html: 'Übernimm die Klasse <b>Hund</b> in JPad. Sie kann schon bellen.' },
      { type: 'code', lang: 'java', code: 'public class Hund {\n    public void bellen() {\n        println("Wuff!");\n    }\n}' } ] },
    { title: 'Bello bellt dreimal', sub: 'Programmier-Aufgabe', blocks: [
      { type: 'jtask', id: 'j1', title: 'Dreimal Wuff', html: 'Erzeuge einen Hund <code>bello</code> und lass ihn <b>dreimal</b> bellen. Starte dann das Programm.', start: 'Hund bello = new Hund();\n', expect: 'Wuff!\nWuff!\nWuff!', compare: 'gleich', needs: ['bello.bellen()'], xp: 20, tips: ['Eine Methode rufst du mit <code>bello.bellen();</code> auf.'], solution: '', img: '' },
      { type: 'lock', after: 'j1' },
      { type: 'info', kind: 'merke', title: 'Merke', html: 'Methoden rufst du mit <code>objekt.methode()</code> auf.' } ] },
  ].map((s, i) => ({ id: 's' + i, check: false, ...s, blocks: s.blocks.map((b, j) => ({ id: b.id || `b${i}${j}`, ...b })) })),
  cert: { on: true, need: 'alle', pct: 80, text: 'hat den Lernpfad erfolgreich bearbeitet.', show: { zeit: true, tipps: true, quiz: true, xp: true } },
});

let host = {};
let gotOpen = false; // hat JPad den Lernpfad des Projekts geschickt?
let bridge = null;
if (inJPad) {
  bridge = makeBridge();
  host = createBridgeHost(bridge, { editor: true });
  addEventListener('message', async e => {
    // vom eigenen Server (JPad) – e.source ist in manchen Browsern nicht derselbe Verweis wie parent
    if (e.origin !== location.origin || !String(e.data?.type || '').startsWith('pf-open')) return;
    gotOpen = true;
    if (e.data.type !== 'pf-open') return; // pf-open-none: Projekt hat (noch) keinen Lernpfad
    let why = '';
    try {
      if (e.data.doc) { api.openDoc(e.data.doc); api.toast('Lernpfad aus dem Projekt geöffnet'); return; }
    } catch (er) { console.warn(er); why = er?.message || String(er); }
    try { if (e.data.html && await api.importHtml(e.data.html)) return; } // älterer Lernpfad: Inhalte werden Bausteine, Design bleibt
    catch (er) { why = why || er?.message || String(er); }
    if (e.data.doc || e.data.html) api.toast('⚠ Der Lernpfad des Projekts ließ sich nicht öffnen' + (why ? ' (' + why + ')' : '') + ' – angezeigt wird dein letzter Entwurf.', 10000);
  });
  // Lehrkraft bearbeitet den Lernpfad des Projekts: „Fertig“ schreibt ihn ins Projekt zurück, ✕ verwirft
  const bar = document.getElementById('edBar');
  const done = document.createElement('button'); done.className = 'ed-btn pf-done'; done.title = 'Fertig: Lernpfad ins Projekt übernehmen'; done.innerHTML = '✓<span class="t"> Fertig</span>';
  done.onclick = async () => { done.disabled = true; try { bridge.post({ type: 'jpad-set-lernpfad', html: await api.buildForApp(), title: api.current.title }); } catch (e) { done.disabled = false; api.toast('Übernehmen fehlgeschlagen: ' + e.message); } };
  const x = document.createElement('button'); x.className = 'ed-btn'; x.title = 'Schließen ohne Übernehmen'; x.setAttribute('aria-label', 'Schließen ohne Übernehmen'); x.textContent = '✕';
  x.onclick = () => { if (api.dirty && !confirm('Änderungen nicht ins Projekt übernehmen? (Dein Entwurf bleibt im Editor gespeichert.)')) return; bridge.post({ type: 'pf-editor-close' }); };
  bar.append(done, x);
}
const api = startPathFinder({ appName: 'JPad', logo: '../jpad-icon.svg', storage: 'jpad-pathfinder', plugins: [jpadPlugin], host, sample });
if (bridge) { // nachfragen, falls die erste Meldung zu früh kam
  let n = 0; const ask = () => { if (gotOpen || n++ > 5) return; bridge.post({ type: 'pf-editor-ready' }); setTimeout(ask, 800); }; setTimeout(ask, 50);
}
</script>
</body></html>
